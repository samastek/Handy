name: "Main Branch Build"

# Runs the full cross-platform build on every push to main so breakage is
# caught before a manual release is triggered. Artifacts are kept for 30 days
# so any commit on main has a downloadable, testable build.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          # Self-hosted runner on hypervisor-01 (homelab-ansible stack
          # `github-runner`, Ubuntu 22.04 image). The label contains
          # "ubuntu-22.04" so build.yml takes its 22.04 dependency steps.
          - platform: "ubuntu-22.04-hypervisor"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      # No Apple certificate on the fork: the .dmg is unsigned.
      sign-binaries: false
    secrets: inherit
